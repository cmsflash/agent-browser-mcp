<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.45 -apple-system, system-ui, sans-serif; width: 320px; margin: 0; padding: 12px; color: #1a1a1a; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    .status { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; }
    .dot.on { background: #1a7f37; }
    .muted { color: #777; font-size: 12px; }
    ul { list-style: none; padding: 0; margin: 8px 0; }
    li { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border: 1px solid #e2e2e2; border-radius: 6px; margin-bottom: 6px; }
    li .name { font-weight: 600; }
    li .meta { color: #777; font-size: 11px; }
    button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #ccc; background: #f7f7f7; cursor: pointer; }
    button:hover { background: #eee; }
    .danger { color: #b3261e; border-color: #e6b8b5; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1e1e; color: #eee; }
      li { border-color: #3a3a3a; }
      button { background: #2a2a2a; border-color: #444; color: #eee; }
      button:hover { background: #333; }
      .muted, li .meta { color: #9a9a9a; }
    }
  </style>
</head>
<body>
  <h1>Chrome Agent Bridge</h1>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="statusText">checking…</span>
  </div>
  <div class="muted" id="wsUrl"></div>
  <div id="groups"></div>
  <div class="row">
    <button id="reconnect">Reconnect</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
